openapi: 3.0.3
info:
  title: BookLeaf Author Support & Communication Portal API
  version: 1.0.0
  description: |
    REST API for the author and admin portals.
    All routes except `/auth/login`, `/health` and `/docs` require `Authorization: Bearer <JWT>`.
    Errors always use the shape `{ "error": { "code", "message", "details?" } }`.
servers:
  - url: /api
tags:
  - { name: Auth }
  - { name: Books (author + admin) }
  - { name: Tickets (author) }
  - { name: Admin }
  - { name: Realtime }
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, bearerFormat: JWT }
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string, example: VALIDATION_ERROR }
            message: { type: string }
            details:
              type: array
              items: { type: object, properties: { field: { type: string }, message: { type: string } } }
    Status: { type: string, enum: [Open, In Progress, Resolved, Closed] }
    Priority: { type: string, enum: [Critical, High, Medium, Low] }
    Category:
      type: string
      enum: [Royalty & Payments, ISBN & Metadata Issues, Printing & Quality, Distribution & Availability, Book Status & Production Updates, General Inquiry]
    CreateTicket:
      type: object
      required: [subject, description]
      properties:
        bookId: { type: string, nullable: true, description: "Mongo id of one of the author's books; omit/null for General / Account Level" }
        subject: { type: string, minLength: 5, maxLength: 150 }
        description: { type: string, minLength: 20, maxLength: 5000 }
        attachmentName: { type: string, nullable: true, description: UI-only; file is not uploaded }
  responses:
    Unauthorized: { description: Missing/invalid token, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Forbidden: { description: Role not allowed, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    NotFound: { description: Not found (also returned for other authors' resources), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Invalid: { description: Validation error, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
security:
  - bearer: []
paths:
  /health:
    get: { summary: Health check, security: [], responses: { '200': { description: ok } } }
  /auth/login:
    post:
      tags: [Auth]
      summary: Email + password login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [email, password], properties: { email: { type: string }, password: { type: string } } }
      responses:
        '200': { description: "{ data: { token, user: { id, name, email, role } } }" }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { description: Invalid credentials }
        '429': { description: Too many login attempts }
  /auth/me:
    get: { tags: [Auth], summary: Current user, responses: { '200': { description: user }, '401': { $ref: '#/components/responses/Unauthorized' } } }
  /books:
    get:
      tags: [Books (author + admin)]
      summary: Author -> own books only. Admin -> all books.
      responses: { '200': { description: "{ data: Book[] }" }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /books/{id}:
    get:
      tags: [Books (author + admin)]
      summary: One book (404 if it belongs to another author)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: book }, '404': { $ref: '#/components/responses/NotFound' } }
  /tickets:
    post:
      tags: [Tickets (author)]
      summary: Create a ticket (AI classification runs in the background)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateTicket' } } } }
      responses:
        '201': { description: Created. Always succeeds even if the AI provider is down. }
        '400': { $ref: '#/components/responses/Invalid' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: bookId is not one of your books }
    get:
      tags: [Tickets (author)]
      summary: My tickets with admin responses (no internal notes / AI data)
      responses: { '200': { description: "{ data: Ticket[] }" }, '403': { $ref: '#/components/responses/Forbidden' } }
  /tickets/{id}:
    get:
      tags: [Tickets (author)]
      summary: One of my tickets
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: ticket }, '404': { $ref: '#/components/responses/NotFound' } }
  /admin/tickets:
    get:
      tags: [Admin]
      summary: Ticket queue (default sort = urgency - active first, highest priority first, oldest first)
      parameters:
        - { name: status, in: query, schema: { type: string }, description: "active | one status | comma-separated list" }
        - { name: category, in: query, schema: { $ref: '#/components/schemas/Category' } }
        - { name: priority, in: query, schema: { $ref: '#/components/schemas/Priority' } }
        - { name: assignee, in: query, schema: { type: string, enum: [me, unassigned] } }
        - { name: q, in: query, schema: { type: string }, description: subject search }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: sort, in: query, schema: { type: string, enum: [urgency, newest, oldest], default: urgency } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 100 } }
      responses: { '200': { description: "{ data: Ticket[], meta: { total, page, limit } }" }, '403': { $ref: '#/components/responses/Forbidden' } }
  /admin/tickets/stats:
    get: { tags: [Admin], summary: Counts by status, active by priority, oldest active, unassigned, responses: { '200': { description: stats } } }
  /admin/tickets/{id}:
    get:
      tags: [Admin]
      summary: Full ticket incl. internal notes, author, book snapshot
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: ticket }, '404': { $ref: '#/components/responses/NotFound' } }
    patch:
      tags: [Admin]
      summary: Update status, override category/priority, assign
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { $ref: '#/components/schemas/Status' }
                category: { $ref: '#/components/schemas/Category' }
                priority: { $ref: '#/components/schemas/Priority' }
                assignedTo: { type: string, nullable: true, enum: [me], description: '"me" assigns to yourself, null unassigns' }
      responses: { '200': { description: updated ticket }, '400': { $ref: '#/components/responses/Invalid' }, '404': { $ref: '#/components/responses/NotFound' } }
  /admin/tickets/{id}/notes:
    post:
      tags: [Admin]
      summary: Add an internal note (never visible to the author)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [text], properties: { text: { type: string } } } } } }
      responses: { '201': { description: note }, '400': { $ref: '#/components/responses/Invalid' } }
  /admin/tickets/{id}/responses:
    post:
      tags: [Admin]
      summary: Send a reply to the author (appears on their ticket in real time)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string, minLength: 10 }
                status: { $ref: '#/components/schemas/Status' }
                aiAssisted: { type: boolean, description: reply started from the AI draft }
      responses: { '201': { description: response }, '400': { $ref: '#/components/responses/Invalid' } }
  /admin/tickets/{id}/ai/draft:
    post:
      tags: [Admin]
      summary: Get the AI draft reply (generated once, then cached). Add ?regenerate=true to redo it.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: regenerate, in: query, schema: { type: boolean } }
      responses:
        '200': { description: "{ data: { draft } }" }
        '503': { description: "AI unavailable or not configured - admin writes manually. code = AI_NOT_CONFIGURED | AI_RATE_LIMITED | AI_TIMEOUT | AI_UNAVAILABLE | AI_CIRCUIT_OPEN" }
  /admin/tickets/{id}/ai/triage:
    post:
      tags: [Admin]
      summary: Re-run AI classification + priority (e.g. after an outage). Admin overrides are never overwritten.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: updated ticket } }
  /admin/ai/status:
    get: { tags: [Admin], summary: "AI health + token counters (state: online | degraded | disabled)", responses: { '200': { description: status } } }
  /stream:
    get:
      tags: [Realtime]
      summary: Server-Sent Events. Events carry only { type, ticketId }; clients refetch through the REST API.
      description: "EventSource cannot set headers, so the JWT is passed as ?token=. Admins receive all events, authors only their own tickets'."
      security: []
      parameters: [{ name: token, in: query, required: true, schema: { type: string } }]
      responses: { '200': { description: text/event-stream }, '401': { $ref: '#/components/responses/Unauthorized' } }
